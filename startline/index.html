<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Startline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060b16;--bg2:#0c1424;--bg3:#142138;--rule:#1f2f4d;--rule2:#334973;--text:#eef2fb;--muted:#93a4c6;--dim:#5a6c92;--accent:#ffb52e;--accent-ink:#1c1200;--up:#3bd97b;--down:#ff5f5f;--warn:#ffb52e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%}
body{background-image:linear-gradient(115deg,#0a1226 0%,#060b16 55%)}
a{color:var(--accent)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:42px;line-height:.95;margin:0;letter-spacing:.05em;text-transform:uppercase}
.sub{margin:6px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.sub.err{color:var(--down)}
.hdr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font:600 15px 'Rajdhani',sans-serif;text-transform:uppercase;letter-spacing:.05em;background:var(--bg3);color:var(--text);border:1px solid var(--rule2);border-radius:4px;padding:8px 12px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.icon{padding:8px 11px;font-size:18px;line-height:1}
button.small{min-height:32px;padding:4px 10px;font-size:13px;font-weight:500}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--rule);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:19px;letter-spacing:.06em;padding:10px 10px 6px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;border-radius:0;cursor:pointer;white-space:nowrap;min-height:0}
.tab:hover{border-color:transparent}
.tab.active{color:var(--text);border-bottom-color:var(--accent);text-shadow:0 0 16px rgba(255,181,46,.45)}
.tab.right{margin-left:auto}
main{padding:12px 12px calc(40px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
main.wide{max-width:1560px}
h2{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:24px;letter-spacing:.04em;margin:22px 0 6px;line-height:1;text-transform:uppercase}
h3{font-size:14px;font-weight:600;margin:18px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)} .dim{color:var(--dim)} .up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)}

/* ---- matchup cards (Week tab and the top of each league tab) */
.cards{display:grid;gap:12px}
#main:not(.wide) .cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 12px;scrollbar-width:none}
#main:not(.wide) .cards::-webkit-scrollbar{display:none}
#main:not(.wide) .cards>.card{flex:0 0 100%;scroll-snap-align:center;min-width:0}
.card{background:var(--bg2);background-image:linear-gradient(180deg,#0f1830,#0b1222);border:1px solid var(--rule);border-top:3px solid var(--acc,var(--rule));border-radius:6px;padding:12px 14px 10px}
.card > .head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.card h2{margin:0}
.plat{color:var(--acc,var(--dim));font-size:12px;font-weight:600}
.pill{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 14px;border-radius:0;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);background:var(--bg3);color:var(--muted);white-space:nowrap}
.pill.live{background:rgba(255,181,46,.18);color:var(--accent)}
.pill.final{background:rgba(59,217,123,.14);color:var(--up)}
.pill.err{background:rgba(255,95,95,.16);color:var(--down)}
.pill.live::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px;animation:blip 1.6s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.pill.live::before{animation:none}}
.side{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:6px 0}
.side + .side{border-top:1px solid var(--rule)}
.side .who{min-width:0}
.side .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .meta{color:var(--muted);font-size:12px}
.side .left{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
.side .left b{color:var(--text);font-weight:600}
.side .left.done{color:var(--dim)}
.score{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:44px;line-height:.95;min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
.side.ahead .score{color:var(--text)} .side.behind .score{color:var(--muted)}
.side.won .score{color:var(--up)} .side.lost .score{color:var(--down)}
.proj{color:var(--dim);font-size:11px;text-align:right;font-family:'JetBrains Mono',monospace}
.cbs .side .proj{color:var(--text);font-size:13px;font-weight:600}
details{margin-top:6px}
summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0;list-style:none;display:flex;gap:6px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸';font-size:11px}
details[open] summary::before{content:'▾'}
.card details table{border-collapse:collapse;width:100%;font-size:13px}
.card details td{padding:5px 4px;border-top:1px solid var(--rule);vertical-align:top}
.card details td.slot{color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:11px;width:34px;padding-top:7px}
.card details td.pl{min-width:0}
.card details td.pl .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.card details td.pl .g{color:var(--dim);font-size:11px;white-space:nowrap}
.card details td.pl .g.live{color:var(--accent)}
.card details td.pts{font-family:'JetBrains Mono',monospace;text-align:right;white-space:nowrap;width:44px;padding-top:7px}
.card details td.pts.zero{color:var(--dim)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;padding:2px 0 0}
.vs .tm{min-width:0}
.vs .tm.op{text-align:right}
.vs .nm{font-weight:600;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .mid{display:flex;flex-direction:column;align-items:center;gap:1px}
.vs .bigs{display:flex;align-items:baseline;gap:7px;justify-content:center}
.vs .now{color:var(--muted);font-size:11px;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.sc{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:41px;line-height:.95;font-variant-numeric:tabular-nums}
.sc.ahead{color:var(--text)} .sc.behind{color:var(--muted)} .sc.won{color:var(--up)} .sc.lost{color:var(--down)}
.vs .dash{color:var(--dim);font-size:18px}
.subvs{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;font-family:'JetBrains Mono',monospace;margin-top:2px}
.card .duel{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
.card .duel td{padding:5px 2px;border-top:1px solid var(--rule);vertical-align:top}
.card .duel td.slot{color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:10px;width:44px;text-align:center;padding-top:8px}
.card .duel td.pts{font-family:'JetBrains Mono',monospace;text-align:right;white-space:nowrap;width:44px;padding-top:7px}
.card .duel td.pts.op{text-align:left}
.card .duel td.pts.zero{color:var(--dim)}
.card .duel td.pts.pp{color:var(--muted);font-style:italic}
.card .duel td.pts.lv{color:var(--accent)}
.card .duel td.pl{min-width:0}
.card .duel td.pl .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:29vw}
.card .duel td.pl .g{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:29vw}
.card .duel td.pl .g.live{color:var(--accent)}
.card .duel td.pl.op{text-align:right}
@media (min-width:700px){ .sc{font-size:46px} .card .duel td.pl .n,.card .duel td.pl .g{max-width:none} }
.cbs .side input{font:inherit;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:44px;line-height:.95;width:96px;text-align:right;background:var(--bg3);border:1px solid var(--rule2);border-radius:8px;color:var(--text);padding:2px 8px}
.cbs .side input::placeholder{color:var(--rule2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.row a{color:var(--accent);text-decoration:none;font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.note{color:var(--muted);font-size:13px;margin:4px 0}
.note.err{color:var(--down)}

/* ---- start/sit tables (league tabs and Board) */
.lede{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;margin:10px 0 12px}
.lede .swaps{margin:6px 0 0;padding-left:18px}
.lede .swaps li{margin:2px 0}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--bg2)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--bg2);position:sticky;top:0;z-index:1}
.tbl th.sortable{cursor:pointer} .tbl th.sortable:hover{color:var(--text)} .tbl th.sorted{color:var(--text)}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.tbl td.slot{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;letter-spacing:.05em;color:var(--muted);width:60px}
.tbl td.proj{font-weight:600;color:var(--text);font-family:'JetBrains Mono',monospace;text-align:right}
.tbl td.name{font-weight:500;white-space:normal}
.tbl tr.close td{background:rgba(255,181,46,.07)}
.tbl tr.zero td{color:var(--dim)}
.tbl tr.zero td.name{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:2px;background:var(--bg3);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.pos{background:transparent;border:1px solid var(--rule2);margin-left:0}
.tag.inj{background:rgba(255,95,95,.18);color:var(--down)}
.tag.warn{background:rgba(255,181,46,.15);color:var(--warn)}
.tag.on{background:rgba(255,181,46,.2);color:var(--accent)}
.gap{color:var(--muted)}
.gap.close{color:var(--accent);font-weight:600}
.games{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.game{border:1px solid var(--rule);border-radius:8px;padding:6px 10px;background:var(--bg2);font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5}
.game b{font-family:'Hanken Grotesk',sans-serif;font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.filters label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.empty{border:1px dashed var(--rule2);border-radius:10px;padding:22px;color:var(--muted);max-width:70ch;margin-top:12px}
.empty ol{padding-left:20px} .empty li{margin:4px 0}
.foot{color:var(--muted);font-size:12px;margin-top:12px;max-width:90ch}

/* ---- settings */
input[type=text],input[type=url],input[type=number],input[type=password],select,textarea{font:inherit;width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--rule2);border-radius:8px;padding:9px 10px}
select{width:auto}
textarea{min-height:100px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;resize:vertical}
textarea.json{min-height:320px}
.field{margin:12px 0}
.field label{display:block;font-weight:600;margin-bottom:4px}
.field .help{color:var(--muted);font-size:12px;margin:3px 0 0}
.help{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--bg2)}
.panel h3{margin-top:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--rule2);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (min-width:700px){ h1{font-size:46px} .score{font-size:48px} header.top{padding-left:20px;padding-right:20px} main{padding-left:20px;padding-right:20px} .tabs{padding:0 14px} }
</style>
</head>
<body>
<header class="top">
  <div><h1>Startline</h1><p class="sub" id="status">Loading…</p></div>
  <div class="hdr">
    <button class="icon" id="prev" title="Previous week">‹</button>
    <button id="wk" title="Back to the current week">Week</button>
    <button class="icon" id="next" title="Next week">›</button>
    <button class="primary" id="btnPull" title="Costs Odds API credits">Pull lines</button>
    <button id="btnScores" title="Free">Refresh scores</button>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   STARTLINE — one phone screen for the fantasy week.
   Week tab: live matchups for every league (Sleeper, ESPN, CBS).
   League tabs: the same matchup card plus start/sit from Vegas lines (The Odds API).
   Board: every player with props, scored under every league's rules.
   Vanilla JS, no build step. Secrets live in the Cloudflare Worker, never here.
   ============================================================ */

// The projection math and lineup optimizer, kept exactly as tested (test_engine.js, check_live.js).
const E = (function(){
/*ENGINE-START*/
const TEAMS = [['Arizona Cardinals','ARI','cardinals'],['Atlanta Falcons','ATL','falcons'],['Baltimore Ravens','BAL','ravens'],['Buffalo Bills','BUF','bills'],['Carolina Panthers','CAR','panthers'],['Chicago Bears','CHI','bears'],['Cincinnati Bengals','CIN','bengals'],['Cleveland Browns','CLE','browns'],['Dallas Cowboys','DAL','cowboys'],['Denver Broncos','DEN','broncos'],['Detroit Lions','DET','lions'],['Green Bay Packers','GB','packers'],['Houston Texans','HOU','texans'],['Indianapolis Colts','IND','colts'],['Jacksonville Jaguars','JAX','jaguars'],['Kansas City Chiefs','KC','chiefs'],['Las Vegas Raiders','LV','raiders'],['Los Angeles Chargers','LAC','chargers'],['Los Angeles Rams','LAR','rams'],['Miami Dolphins','MIA','dolphins'],['Minnesota Vikings','MIN','vikings'],['New England Patriots','NE','patriots'],['New Orleans Saints','NO','saints'],['New York Giants','NYG','giants'],['New York Jets','NYJ','jets'],['Philadelphia Eagles','PHI','eagles'],['Pittsburgh Steelers','PIT','steelers'],['San Francisco 49ers','SF','49ers'],['Seattle Seahawks','SEA','seahawks'],['Tampa Bay Buccaneers','TB','buccaneers'],['Tennessee Titans','TEN','titans'],['Washington Commanders','WAS','commanders']];
const FULL_TO_ABBR = {}, NICK_TO_ABBR = {jags:'JAX', pats:'NE', niners:'SF', bucs:'TB'};
const ABBR_ALIASES = {WSH:'WAS', JAC:'JAX', LVR:'LV', GNB:'GB', KAN:'KC', NWE:'NE', NOR:'NO', SFO:'SF', TAM:'TB', OAK:'LV', SD:'LAC', SDG:'LAC', STL:'LAR', LA:'LAR', ARZ:'ARI', BLT:'BAL', CLV:'CLE', HST:'HOU'};
TEAMS.forEach(([full,ab,nick]) => { FULL_TO_ABBR[full] = ab; NICK_TO_ABBR[nick] = ab; });
function teamAbbr(s){
  if(!s) return null; const t = String(s).trim();
  if(FULL_TO_ABBR[t]) return FULL_TO_ABBR[t];
  const up = t.toUpperCase(); if(ABBR_ALIASES[up]) return ABBR_ALIASES[up]; if(TEAMS.some(x => x[1] === up)) return up;
  const low = t.toLowerCase(); for(const [nick, ab] of Object.entries(NICK_TO_ABBR)) if(low.includes(nick)) return ab;
  return null;
}

const MARKET_KIND = {player_pass_yds:'pass_yds', player_pass_tds:'pass_tds', player_pass_interceptions:'ints', player_rush_yds:'rush_yds', player_receptions:'rec', player_reception_yds:'rec_yds', player_anytime_td:'atd', player_kicking_points:'kick'};
// Normal-approximation spread of each stat around its posted line (used to turn Over/Under prices into an expectation).
const SIGMA = {pass_yds:l => Math.max(20, 0.27*l), rush_yds:l => Math.max(12, 0.55*l), rec_yds:l => Math.max(12, 0.60*l), rec:l => Math.max(1.2, 0.40*l), kick:l => Math.max(2.5, 0.45*l)};
// Mean sits a little above the median for right-skewed yardage stats.
const SKEW = {pass_yds:1.00, rush_yds:1.03, rec_yds:1.04, rec:1.00, kick:1.00};
const FUMBLES_LOST = {QB:0.10, RB:0.05, WR:0.02, TE:0.02};
const OFF_TD_PER_POINT = 0.104;      // offensive TDs per implied team point (≈2.3 TDs at 22.5 pts)
const ATD_DEVIG = [0.55, 0.92];      // bounds on the per-team scale applied to anytime-TD implied probabilities
const SLOT_ORDER = ['QB','RB','WR','TE','FLEX','SFLEX','K','DST'];
const SLOT_ELIG = {QB:['QB'], RB:['RB'], WR:['WR'], TE:['TE'], FLEX:['RB','WR','TE'], SFLEX:['QB','RB','WR','TE'], K:['K'], DST:['DST']};
const INJ_SHORT = {Questionable:'Q', Doubtful:'D', Out:'OUT', IR:'IR', PUP:'PUP', Sus:'SUS', NA:'NA', COV:'COV', DNR:'DNR'};
const INACTIVE = /^(Out|IR|PUP|Sus|NA|DNR)$/i;

const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const mean = a => a.length ? a.reduce((x,y) => x+y, 0)/a.length : null;
function median(a){ const s=[...a].sort((x,y)=>x-y), n=s.length; if(!n) return null; return n%2 ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2; }
function amToProb(p){ p = Number(p); if(!isFinite(p) || p === 0) return null; return p < 0 ? (-p)/((-p)+100) : 100/(p+100); }
function normInv(p){
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const pl=0.02425, ph=1-pl; let q, r;
  if(p < pl){ q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p <= ph){ q=p-0.5; r=q*q; return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}

function survivorRows(entries, weekGames, week){
  // entries: {A:['DET','JAX',...]} (index 0 = week 1); weekGames: {w: games[]}
  return Object.entries(entries).map(([entry, picks]) => {
    let alive=true, outWeek=null; const hist=[];
    for(let w=1; w<=week; w++){
      const team = normAbbr(picks[w-1]); const games = weekGames[w];
      if(!team){ hist.push({w, team:null, result: w<week ? 'no pick' : 'pending'}); continue; }   // a missing past pick is shown, not treated as a loss
      const g = games ? games.find(g => g.teams.some(t => t.abbr===team)) : null;
      let result = 'pending';
      if(!games) result = 'pending'; else if(!g) result = 'no game';
      else if(g.state==='post'){ const me=g.teams.find(t=>t.abbr===team), them=g.teams.find(t=>t.abbr!==team); result = me.winner ? 'win' : (them && me.score===them.score ? 'tie' : 'loss'); }
      else if(g.state==='in') result = 'live';
      hist.push({w, team, game:g, result});
      if(alive && (result==='loss' || result==='tie')){ alive=false; outWeek=w; }
    }
    return {entry, alive, outWeek, now: hist[week-1] || {w:week, team:null, result:'pending'}, hist};
  });
}

function parseBoxscore(sum){
  const players = {}, dstTd = {}, dstSaf = {};
  for(const side of (sum.boxscore?.players || [])){
    const team = normAbbr(side.team?.abbreviation);
    for(const cat of (side.statistics || [])){
      const L = cat.labels || [], col = lbl => L.indexOf(lbl);
      for(const a of (cat.athletes || [])){
        const name = a.athlete?.displayName; if(!name) continue;
        const p = players[normName(name)+'|'+team] ||= {name, team, passYds:0, passTd:0, ints:0, rushYds:0, rushTd:0, rec:0, recYds:0, recTd:0, retTd:0, fumLost:0, kickPts:0};
        const n = lbl => { const i = col(lbl); return i>=0 ? Number(a.stats?.[i])||0 : 0; };
        if(cat.name==='passing'){ p.passYds += n('YDS'); p.passTd += n('TD'); p.ints += n('INT'); }
        else if(cat.name==='rushing'){ p.rushYds += n('YDS'); p.rushTd += n('TD'); }
        else if(cat.name==='receiving'){ p.rec += n('REC'); p.recYds += n('YDS'); p.recTd += n('TD'); }
        else if(cat.name==='fumbles'){ p.fumLost += n('LOST'); }
        else if(cat.name==='kickReturns' || cat.name==='puntReturns'){ p.retTd += n('TD'); }
        else if(cat.name==='kicking'){ p.kickPts += n('PTS'); }
      }
    }
  }
  for(const sp of (sum.scoringPlays || [])){
    const t = normAbbr(sp.team?.abbreviation); if(!t) continue;
    if(sp.type?.abbreviation==='SF'){ dstSaf[t] = (dstSaf[t]||0)+1; continue; }
    if(sp.type?.abbreviation!=='TD' || !/(interception|fumble|punt|kick(off)?|blocked[^.]*) return/i.test(sp.text||'')) continue;
    dstTd[t] = (dstTd[t]||0)+1;
  }
  return {players, dstTd, dstSaf};
}

    ...(data.schedule||[]).flatMap(s => [s.home, s.away]).flatMap(x => x?.rosterForCurrentScoringPeriod?.entries || x?.rosterForMatchupPeriod?.entries || [])]
    .map(e => { const p = e.playerPoolEntry?.player||{}; return {name:p.fullName, team:PRO_TEAM[p.proTeamId]||null}; }));
  if(lg.myTeamId) state.live[lg.id] = espnSnapshot(data, lg, past ? week : (data.status?.currentMatchupPeriod || data.scoringPeriodId));
  if(card.me && lg.myTeamId){
    const period = past ? week : (data.status?.currentMatchupPeriod || data.scoringPeriodId);
    const m = (data.schedule||[]).find(s => s.matchupPeriodId===period && (s.home?.teamId===lg.myTeamId || s.away?.teamId===lg.myTeamId));
    const bench = side => (side?.rosterForCurrentScoringPeriod?.entries || side?.rosterForMatchupPeriod?.entries || [])
      .filter(e => e.lineupSlotId===20 || e.lineupSlotId===21)
      .map(e => { const p = e.playerPoolEntry?.player || {};

// CBS live link: the league subdomain's JSON API, reached through the worker (which holds the login
// cookie). One scoring/live call carries both scores, the opponent, the record, and every roster,
// so the card and the start/sit tab sync themselves. Any failure falls back to the manual card.
async function loadCbsCard(lg, week){
  const card = {kind:'cbs', name:lg.name, platform:'CBS', week, myTeam:lg.myTeam||'My team',
                opp:(lg.schedule||{})[week]||'', url:lg.url||'', scores: state.cbs[week]||{}};
  const base = workerBase();
  if(!base || !lg.leagueId || (state.autoWeek && week!==state.autoWeek)) return card;
  try{
    const data = await fetchJSON(`${base}/cbs/api/league/scoring/live?version=3.0&response_format=json&league_id=${encodeURIComponent(lg.leagueId)}`);
    const ls = data.body?.live_scoring;
    if(!ls || !Array.isArray(ls.teams)) throw new Error('no live scoring in the CBS response');
    const mine = ls.teams.find(t => String(t.id)===String(ls.my_team_id));
    if(!mine) throw new Error('logged-in team not found in the CBS feed');
    const mu = (mine.matchups||[])[0] || {};
    const oppT = ls.teams.find(t => String(t.id)===String(mu.opponent_team_id)) || null;
    const side = t => ({
      name: t.name || '?', record: `${t.record||''}${Number(t.t)?'-'+t.t:''}`,
      points: Number(t.pts)||0, projected: null,
      starters: (t.players||[]).filter(p => p.status==='Active').map(p => ({
        slot: p.roster_pos==='RB-WR-TE' ? 'FLEX' : (p.roster_pos||p.position||''),
        name: p.fullname || `${p.firstname||''} ${p.lastname||''}`.trim(),
        pos: p.position||'', team: normAbbr(p.pro_team), pts: Number(p.fpts)||0,
      })),
      bench: (t.players||[]).filter(p => p.status!=='Active').map(p => ({
        slot:'BN', name: p.fullname || `${p.firstname||''} ${p.lastname||''}`.trim(),
        pos: p.position||'', team: normAbbr(p.pro_team), pts: p.fpts!=null ? Number(p.fpts) : null,
      })),
    });
    card.me = side(mine);
    card.opp = oppT ? side(oppT)
             : mu.opponent_team ? {name:mu.opponent_team, record:'', points:Number(mu.opponent_pts)||0, projected:null, starters:[]} : null;
    state.live[lg.id] = {at:Date.now(), kind:'cbs', entries: (mine.players||[]).map(p => ({
      name: p.fullname || `${p.firstname||''} ${p.lastname||''}`.trim(), pos: p.position||'',
      team: normAbbr(p.pro_team), slot: p.roster_pos==='RB-WR-TE' ? 'FLEX' : (p.roster_pos||null),
      starter: p.status==='Active', pts: p.fpts!=null ? Number(p.fpts) : null,
    }))};
    state.lgRost[lg.id] = rostSet(ls.teams.flatMap(t => (t.players||[]).map(p => ({name: p.fullname || `${p.firstname||''} ${p.lastname||''}`.trim(), team: normAbbr(p.pro_team)}))));
  }catch(e){ card.liveErr = e.message; }
  return card;
}
function loadCard(lg, week){
  if(lg.platform==='sleeper') return loadSleeperCard(lg, week);
  if(lg.platform==='espn') return loadEspnCard(lg, week);
  return loadCbsCard(lg, week);
}
async function refreshScores(){
  if(state.busy) return; state.busy=true; state.error=null; setBusy('Refreshing scores…');
  try{
    try{ const st = await fetchJSON(`${SLEEPER}/state/nfl`); state.autoWeek = st.week; state.season = Number(st.season)||state.season; }catch(e){}
    if(!state.season) state.season = (state.config.leagues.find(l => l.season)||{}).season || new Date().getFullYear();
    if(!state.autoWeek){ try{ const sb = parseScoreboard(await fetchJSON(NFL_SB)); state.autoWeek = sb.week||1; }catch(e){ state.autoWeek = 1; } }
    const week = state.week || state.autoWeek || 1;
    try{ state.sbIdx = teamStatusIndex({games: await nflWeek(week)}); }catch(e){ state.sbIdx = {}; }
    try{ await loadBox(); }catch(e){}
    try{ await ensurePlayers(); }catch(e){ state.error = 'Sleeper player list failed: '+e.message; }
    setBusy('Loading matchups…');
    const jobs = state.config.leagues.map(lg =>
      loadCard(lg, week).then(c => { c.id = lg.id; return c; })
        .catch(e => ({kind:'league', id:lg.id, name:lg.name, platform:PLATFORM[lg.platform]||'', week, error:e.message})));
    state.cards = await Promise.all(jobs); state.at = Date.now();
    saveJSON(LS.live, state.live);
    recompute(); applyProjectedFinals();
    saveJSON(LS.snap, {at:state.at, week, autoWeek:state.autoWeek, season:state.season, cards:state.cards, sbIdx:state.sbIdx});
  }catch(e){ state.error = 'Refresh failed: '+e.message; }
  state.busy=false; state.busyMsg=''; render(); schedule();
}
function anyStarterLive(){
  for(const c of state.cards){
    if(c.kind!=='league' && c.kind!=='cbs') continue;
    for(const s of [c.me, c.opp]){ if(!s) continue;
      for(const p of s.starters||[]){ const st = p.team ? state.sbIdx[p.team] : null; if(st && st.state==='in') return true; } }
  }
  return false;
}
function schedule(){
  clearTimeout(state.timer);
  const secs = anyStarterLive() ? Math.max(20, state.config.refreshSeconds||60) : 300;
  state.timer = setTimeout(() => { if(document.visibilityState==='visible') refreshScores(); else schedule(); }, secs*1000);
}

// ============================================================ rosters → league start/sit views
function dstEntry(team, lg){
  const tg = state.teamGame[team]; const pts = dstPoints(lg.scoring.dst, tg);
  return {key:'dst:'+team, name:(TEAMS.find(t=>t[1]===team)||[team])[0], pos:'DST', team, inj:null, stats:{}, pts, flags: tg ? [] : ['no game this week'], tg};
}
function kickedOff(tg){ return !!(tg && tg.commence && Date.parse(tg.commence) < Date.now()); }
function entryFrom(proj, lg, extra){
  const tg = proj.team ? state.teamGame[proj.team] : null;
  const pts = scorePlayer(proj, lg, state.teamGame); const flags = coverageFlags(proj);
  if(proj.inj) flags.unshift(INJ_SHORT[proj.inj]||proj.inj);
  if(proj.posGuess) flags.push('position guessed');
  if(kickedOff(tg)) flags.push('kicked off');
  return {...proj, ...extra, pts, flags, tg};
}
function stubEntry(name, pos, team, inj, extra){
  const flags = []; const tg = team ? state.teamGame[team] : null;
  const fullSlate = state.cache && Object.keys(state.cache.games).length >= 10;
  if(inj) flags.push(INJ_SHORT[inj]||inj);
  const bye = fullSlate && team && !tg;
  if(bye) flags.push('bye'); else if(state.cache) flags.push('no line');
  if(kickedOff(tg)) flags.push('kicked off');
  return {key:'stub:'+normName(name), name, pos:pos||'?', team:team||null, inj, stats:{}, pts: bye ? 0 : null, flags, tg, ...extra};
}
function resolveRoster(lg){
  const entries = [], notes = [], live = state.live[lg.id];
  if(lg.platform==='sleeper'){
    if(!live) return {entries, notes:['Refresh scores to load this roster from Sleeper.'], current:null};
    const starters = new Set(live.starters), taxi = new Set(live.taxi), reserve = new Set(live.reserve);
    for(const id of live.players){
      const sp = state.players?.byId[id]; const name = sp ? sp.n : ('Sleeper #'+id); const nn = normName(name);
      const extra = {starter:starters.has(id), taxi:taxi.has(id), ir:reserve.has(id), sleeperId:id,
                     actual: (live.pts && live.pts[id]!=null) ? Number(live.pts[id]) : null, slot: (live.slotOf && live.slotOf[id]) || null};
      if(sp && sp.p==='DST'){ entries.push({...dstEntry(sp.t, lg), ...extra}); continue; }
      const proj = findProjection(nn, sp?.t);
      entries.push(proj ? entryFrom(proj, lg, extra) : stubEntry(name, sp?.p, sp?.t, sp?.i, extra));
    }
    return {entries, notes, current: live.starters.length ? 'sleeper' : null};
  }
  if(lg.platform==='espn'){
    if(!live) return {entries, notes:[lg.leagueId ? (lg.myTeamId ? 'Refresh scores to load this roster from ESPN.' : 'Tap your team on the matchup card to load this roster.') : 'Add the ESPN league ID in Settings.'], current:null};
    const ESPN_TO_SLOT = {'RB/WR':'FLEX','WR/TE':'FLEX','OP':'SFLEX','BN':null,'IR':null};
    for(const r of live.entries){
      const extra = {starter:r.starter, taxi:false, ir:r.ir, espnSlot:r.slot,
                     actual: r.pts!=null ? Number(r.pts) : null, slot: ESPN_TO_SLOT[r.slot]!==undefined ? ESPN_TO_SLOT[r.slot] : (r.slot||null)};
      if(r.pos==='DST'){ const t = r.team || teamAbbr(r.name); if(t){ entries.push({...dstEntry(t, lg), ...extra}); continue; } }
      const nn = normName(r.name); const sp = sleeperPlayer(nn, r.team);
      const proj = findProjection(nn, r.team || sp?.t);
      entries.push(proj ? entryFrom(proj, lg, extra) : stubEntry(r.name, r.pos||sp?.p, r.team||sp?.t, sp?.i, extra));
    }
    return {entries, notes, current: entries.some(e => e.starter) ? 'espn' : null};
  }
  if(lg.platform==='cbs' && live && live.kind==='cbs'){
    for(const r of live.entries){
      const extra = {starter:r.starter, taxi:false, ir:false, actual: r.pts!=null?Number(r.pts):null, slot: r.slot||null};
      if(r.pos==='DST'){ const t = r.team || teamAbbr(r.name); if(t){ entries.push({...dstEntry(t, lg), ...extra}); continue; } }
      const nn = normName(r.name); const sp = sleeperPlayer(nn, r.team);
      const proj = findProjection(nn, r.team || sp?.t);
      entries.push(proj ? entryFrom(proj, lg, extra) : stubEntry(r.name, r.pos||sp?.p, r.team||sp?.t, sp?.i, extra));
    }
    return {entries, notes, current:'cbs'};
  }
  let anyStar = false;
  for(const line of lg.roster||[]){
    const r = parseRosterLine(line); if(!r) continue; anyStar = anyStar || r.starter;
    if(r.kind==='dst'){ if(!r.team){ notes.push(`Could not read a team from "${line}" — use e.g. "Titans DST".`); continue; } entries.push({...dstEntry(r.team, lg), starter:r.starter}); continue; }
    const nn = normName(r.name); const sp = sleeperPlayer(nn, r.teamHint);
    const proj = findProjection(nn, r.teamHint || sp?.t);
    if(proj) entries.push(entryFrom(proj, lg, {starter:r.starter}));
    else { if(!sp && state.players) notes.push(`"${r.name}" isn't in the Sleeper player list — check the spelling.`); entries.push(stubEntry(r.name, sp?.p, sp?.t, sp?.i, {starter:r.starter})); }
  }
  return {entries, notes, current: anyStar ? 'manual' : null};
}
function buildView(lg){
  const {entries, notes, current} = resolveRoster(lg);
  const eligible = entries.filter(e => !e.taxi && !e.ir);
  // Games that started are settled facts: swap in the platform's actual points where we have them
  // (falling back to NFL box scores for leagues with no platform feed, e.g. CBS TD-only),
  // and (when the current lineup is known) freeze those players in or out of the lineup.
  for(const e of eligible){
    const st = e.team ? state.sbIdx[e.team] : null;
    e.gs = st ? st.state : (kickedOff(e.tg) ? 'in' : 'pre');
    if(e.gs!=='pre'){
      const actual = e.actual!=null ? e.actual : boxActual(e, lg);
      if(actual!=null){
        e.pts = actual;
        e.flags = [...(e.flags||[]).filter(f => !['kicked off','no line','bye','no game this week'].includes(f)), e.gs==='post' ? 'final' : 'live'];
      } else if(!(e.flags||[]).includes('kicked off')) (e.flags ||= []).push('kicked off');
    }
  }
  let lineup, bench;
  if(current){
    const lockedIn = eligible.filter(e => e.starter && e.gs!=='pre');
    const lockedOut = eligible.filter(e => !e.starter && e.gs!=='pre');
    const free = eligible.filter(e => e.gs==='pre');
    const counts = {...lg.lineup}, placed = [], rest = [];
    for(const e of lockedIn){ const s = e.slot; if(s && counts[s]>0 && (SLOT_ELIG[s]||[]).includes(e.pos)){ counts[s]--; placed.push({slot:s, player:e, locked:true}); } else rest.push(e); }
    for(const e of rest){ const s = SLOT_ORDER.find(k => counts[k]>0 && SLOT_ELIG[k].includes(e.pos)); if(s) counts[s]--; placed.push({slot:s||e.slot||'?', player:e, locked:true}); }
    const opt = optimizeLineup(free, counts);
    lineup = [];
    for(const s of SLOT_ORDER){
      const group = [...placed.filter(x => x.slot===s), ...opt.lineup.filter(x => x.slot===s)];
      const n = lg.lineup[s]||0;
      group.forEach((x,i) => lineup.push({slot:s, label: n>1 ? s+(i+1) : s, player:x.player, locked:!!x.locked}));
    }
    for(const x of placed.filter(x => !SLOT_ORDER.includes(x.slot))) lineup.push({slot:x.slot, label:x.slot, player:x.player, locked:true});
    for(const e of lockedOut){ e.gap = null; e.gapVs = null; }
    bench = [...opt.bench, ...lockedOut].sort((a,b) => (b.pts??-1e9)-(a.pts??-1e9));
  } else {
    ({lineup, bench} = optimizeLineup(eligible, lg.lineup));
  }
  const optPts = lineup.reduce((s,x) => s + (x.player?.pts||0), 0);
  let cur = null;
  if(current){
    const cs = eligible.filter(e => e.starter); const curPts = cs.reduce((s,e) => s + (e.pts||0), 0);
    const optSet = new Set(lineup.filter(x=>x.player).map(x=>x.player.key)), curSet = new Set(cs.map(e=>e.key));
    const ins = lineup.filter(x => x.player && !curSet.has(x.player.key)).map(x => x.player), outs = cs.filter(e => !optSet.has(e.key));
    const left = [...outs], pairs = ins.map(p => { let i = left.findIndex(o => o.pos===p.pos); if(i<0) i = left.findIndex(o => ['QB','RB','WR','TE'].includes(o.pos) && ['QB','RB','WR','TE'].includes(p.pos)); if(i<0) i = left.length ? 0 : -1; return {in:p, out: i>=0 ? left.splice(i,1)[0] : null}; });
    cur = {pts:curPts, ins, outs, pairs, net: optPts-curPts, count: cs.length};
  }
  return {league:lg, entries, lineup, bench, optPts, cur, notes, taxi: entries.filter(e=>e.taxi), ir: entries.filter(e=>e.ir)};
}
function recompute(){
  state.teamGame = state.cache ? buildTeamGame(state.cache.games) : {};
  state.proj = state.cache ? buildProjections(state.cache.store, state.cache.games, state.teamGame, lookupSleeper) : null;
  if(state.proj) for(const p of Object.values(state.proj)){ p.leaguePts = {}; for(const lg of state.config.leagues) p.leaguePts[lg.id] = scorePlayer(p, lg, state.teamGame); }
  state.views = {}; for(const lg of state.config.leagues) state.views[lg.id] = buildView(lg);
  state.rostered = {}; for(const lg of state.config.leagues) for(const e of state.views[lg.id].entries) (state.rostered[e.key] ||= []).push(lg.short||lg.name);

// ============================================================ projected final
function starterProj(s, lg){
  if(s.pos==='DST' || /\bd\/?st\b|\bdefense\b/i.test(s.name)) return dstPoints(lg.scoring.dst, state.teamGame[s.team]);
  const p = findProjection(normName(s.name), s.team);
  return p ? scorePlayer(p, lg, state.teamGame) : null;
}
// points so far + every 'pre' starter's projection + the upside still on the table for 'in' starters.
// 'post' and bye starters contribute only what they already scored.
function projectedFinal(side, lg){
  if(!side || !state.proj || !(side.starters||[]).length) return null;
  let total = Number(side.points)||0, pending = 0, resolved = 0;
  for(const s of side.starters){
    const st = s.team ? state.sbIdx[s.team] : null;
    const gs = st ? st.state : null;
    if(gs!=='pre' && gs!=='in') continue;
    pending++;
    const pr = starterProj(s, lg);
    if(pr==null) continue;
    resolved++;
    const pts = Number(s.pts)||0;
    total += gs==='pre' ? pr : Math.max(pts, pr) - pts;
  }
  if(resolved < pending/2) return null;     // lines cover too few of the remaining starters — keep the platform's own number
  return total;
}
// CBS has no score feed, so the "you" side of that card is the sum of your starters as the NFL
// box scores settle them; once every starter is final the number is stored so the record works.
function cbsAutoScore(c){
  c.auto = null;
  const v = state.views[c.id]; if(!v) return;
  const cs = v.entries.filter(e => e.starter && !e.taxi && !e.ir); if(!cs.length) return;
  let pts=0, proj=0, live=false, done=Object.keys(state.sbIdx).length>0;
  for(const e of cs){
    const settled = e.gs!=='pre' && (e.flags||[]).some(f => f==='final' || f==='live');
    if(settled) pts += e.pts||0;
    if(settled || e.gs==='pre') proj += e.pts||0;
    if(e.gs==='in') live = true;
    const noGame = !e.team || (!state.sbIdx[e.team] && !e.tg);
    if(e.gs!=='post' && !noGame) done = false;
  }
  c.auto = {pts, proj, live, done};
  if(done && (state.cbs[c.week]?.me == null)){
    state.cbs[c.week] = {...(state.cbs[c.week]||{}), me: Math.round(pts*10)/10};
    saveJSON(LS.cbs, state.cbs);
    c.scores = state.cbs[c.week];
  }
}
// With the live CBS link on, both finals come from CBS itself: once every starter on both sides
// is done, store the pair so cbsRecord() keeps working across weeks.
function cbsPersistLive(c){
  const started = Object.keys(state.sbIdx).length>0;
  const meDone = (c.me.starters||[]).length>0 && leftCount(c.me.starters, state.sbIdx).left===0;
  const oppDone = !c.opp || !(c.opp.starters||[]).length || leftCount(c.opp.starters, state.sbIdx).left===0;
  if(!started || !meDone || !oppDone) return;
  const cur = state.cbs[c.week]||{};
  if(cur.me!=null && cur.opp!=null) return;
  state.cbs[c.week] = {me: cur.me ?? Math.round(c.me.points*10)/10,
                       opp: cur.opp ?? (c.opp ? Math.round(c.opp.points*10)/10 : null)};
  saveJSON(LS.cbs, state.cbs);
  c.scores = state.cbs[c.week];
}
function applyProjectedFinals(){
  for(const c of state.cards){
    if(c.kind==='cbs'){
      if(c.me){
        const lg = league(c.id);
        for(const side of [c.me, c.opp]){
          if(!side) continue;
          if(side.projPlatform===undefined) side.projPlatform = side.projected ?? null;
          const p = lg ? projectedFinal(side, lg) : null;
          side.projected = p!=null ? p : side.projPlatform;
        }
        cbsPersistLive(c);
      } else cbsAutoScore(c);
      continue;
    }
    if(c.kind!=='league' || c.error || c.pick) continue;
    const lg = league(c.id); if(!lg) continue;
    for(const side of [c.me, c.opp]){
      if(!side) continue;
      if(side.projPlatform===undefined) side.projPlatform = side.projected ?? null;
      const p = projectedFinal(side, lg);
      side.projected = p!=null ? p : side.projPlatform;
    }
  }
}

// ============================================================ rendering — matchup cards
// App-style matchup layout: score strip up top, my starters lined up against the opponent's
// row by row with the slot in the middle, bench underneath.
function duelCell(p, right, lg){
  if(!p) return right ? `<td class="pts op"></td><td class="pl op"></td>` : `<td class="pl"></td><td class="pts"></td>`;
  const st = p.team ? state.sbIdx[p.team] : null; const gl = gameLine(st?.game, p.team);
  const info = `<div class="n">${esc(p.name)}</div><div class="g ${gl.cls}">${esc(p.team||'')} ${esc(gl.text)}</div>`;
  // hasn't kicked off yet and no points on the board → show the Vegas-line projection, styled apart
  let val = p.pts, cls = p.pts ? '' : ' zero';
  if(st?.state==='in') cls += ' lv';
  if(lg && state.proj && st?.state==='pre' && !(p.pts>0)){
    const pr = starterProj(p, lg);
    if(pr!=null){ val = pr; cls = ' pp'; }
  }
  const pts = `<td class="pts${right?' op':''}${cls}">${fmt(val)}</td>`;
  return right ? pts + `<td class="pl op">${info}</td>` : `<td class="pl">${info}</td>` + pts;
}
function duelRows(A, B, lg){
  const n = Math.max(A?.length||0, B?.length||0); let rows='';
  for(let i=0;i<n;i++){ const a = A?.[i], b = B?.[i];
    rows += `<tr>${duelCell(a,false,lg)}<td class="slot">${esc(a?.slot||b?.slot||'')}</td>${duelCell(b,true,lg)}</tr>`; }
  return rows;
}
function matchupHTML(c, status){
  const lg = league(c.id);
  const fin = status.cls==='final' || c.winner==='HOME' || c.winner==='AWAY';
  const useProj = !fin && (c.me?.projected!=null || c.opp?.projected!=null);
  const scls = (s,o) => { if(!s || !o) return '';
    if(fin) return s.points>o.points ? 'won' : s.points<o.points ? 'lost' : '';
    return s.points>=o.points ? 'ahead' : 'behind'; };
  const tm = (s,op) => `<div class="tm${op?' op':''}">${s ? `<div class="nm">${esc(s.name)}</div><div class="meta">${esc(s.record||'')}${s.owner?' '+esc(s.owner):''}</div>` : `<div class="nm muted">No opponent</div><div class="meta">this week</div>`}</div>`;
  const sub = s => { if(!s || !(s.starters||[]).length) return '';
    const lc = leftCount(s.starters, state.sbIdx);
    return lc.left===0 ? 'done' : `${lc.left} left${lc.live?`, ${lc.live} live`:''}`; };
  let h = `<div class="vs">${tm(c.me,false)}<div class="mid"><div class="bigs"><span class="sc ${scls(c.me,c.opp)}">${fmt(c.me.points)}</span><span class="dash">–</span><span class="sc ${scls(c.opp,c.me)}">${c.opp?fmt(c.opp.points):'—'}</span></div>${useProj?`<div class="now">proj ${fmt(c.me.projected??c.me.points)} – ${c.opp?fmt(c.opp.projected??c.opp.points):'—'}</div>`:''}</div>${tm(c.opp,true)}</div>`;
  h += `<div class="subvs"><span>${sub(c.me)}</span><span>${sub(c.opp)}</span></div>`;
  h += `<table class="duel"><tbody>${duelRows(c.me.starters||[], c.opp?.starters||[], lg)}</tbody></table>`;
  const bn = c.me.bench||[], bo = c.opp?.bench||[];
  if(bn.length || bo.length) h += `<details class="benchd"${window.innerWidth>=700?' open':''}><summary>Bench</summary><table class="duel"><tbody>${duelRows(bn, bo, lg)}</tbody></table></details>`;
  return h;
}
const ACCENT = {sleeper:'#a78bfa', espn:'#f87171', cbs:'#60a5fa'};
const accStyle = c => { const a = ACCENT[c.kind==='cbs' ? 'cbs' : (league(c.id)?.platform||'').toLowerCase()]; return a ? ` style="--acc:${a}"` : ''; };
function cbsRecord(lg){
  const week = state.week || state.autoWeek || 1; let w=0,l=0,t=0;
  for(const [k,s] of Object.entries(state.cbs)){ if(Number(k)>=week || s.me==null || s.opp==null) continue; if(s.me>s.opp) w++; else if(s.me<s.opp) l++; else t++; }
  return `${w}-${l}${t?'-'+t:''}`;
}
function renderCard(c){
  if(c.kind==='league'){
    let body='', pill='';
    if(c.error){ body = `<p class="note err">${esc(c.error)}</p>`; pill = `<span class="pill err">ERROR</span>`; }
    else if(c.pick) body = `<p class="note">Which team is yours?</p><div class="pick">${c.pick.map(t => `<button class="small" data-pick="${t.id}" data-lgid="${esc(c.id)}">${esc(t.name)}${t.owner?` <span class="muted">${esc(t.owner)}</span>`:''}</button>`).join('')}</div>`;
    else { const status = cardStatus([c.me, c.opp], state.sbIdx);
      pill = status.label ? `<span class="pill ${status.cls}">${status.label}</span>` : (c.bye ? `<span class="pill">BYE</span>` : '');
      body = matchupHTML(c, status); }
    return `<article class="card"${accStyle(c)}><div class="head"><h2>${esc(c.name)}</h2><span class="plat">${esc(c.platform)}</span>${pill}</div>${body}</article>`;
  }
  if(c.kind==='cbs'){
    if(c.me){
      const status = cardStatus([c.me, c.opp], state.sbIdx);
      const pill = status.label ? `<span class="pill ${status.cls}">${status.label}</span>` : '';
      return `<article class="card cbs"${accStyle(c)}><div class="head"><h2>${esc(c.name)}</h2><span class="plat">CBS</span>${pill}</div>`
        + matchupHTML(c, status)
        + `<div class="row">${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">Open CBS</a>`:''}<span>Scores and rosters sync live from CBS.</span></div></article>`;
    }
    const s = c.scores||{}, a = c.auto;
    const me = s.me!=null ? s.me : a ? a.pts : null;
    const both = me!=null && s.opp!=null;
    const meMeta = a ? (a.done ? 'you, final' : a.live ? 'you, live from the box scores' : 'you, from the box scores') : 'you';
    return `<article class="card cbs"${accStyle(c)}><div class="head"><h2>${esc(c.name)}</h2><span class="plat">CBS</span><span class="pill" id="cbsRec">${cbsRecord()}</span></div>
      ${c.liveErr?`<p class="note err">CBS live link: ${esc(c.liveErr)}</p>`:''}
      <div class="side ${both?(me>s.opp?'ahead':me<s.opp?'behind':''):''}"><div class="who"><div class="nm">${esc(c.myTeam)}</div><div class="meta">${meMeta}</div></div><div class="left"></div><div><div class="score">${fmt(me??0)}</div>${a && !a.done ? `<div class="proj">proj ${fmt(a.proj)}</div>` : ''}</div></div>
      <div class="side ${both?(s.opp>me?'ahead':s.opp<me?'behind':''):''}"><div class="who"><div class="nm">${esc(c.opp||'Opponent')}</div><div class="meta">${c.opp?'this week':'add the schedule in Settings'}</div></div><div class="left"></div><input type="number" inputmode="decimal" step="0.5" placeholder="0" data-cbs="opp" value="${s.opp??''}" aria-label="Opponent score"></div>
      <div class="row">${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">Open CBS</a>`:''}<span>Your score adds itself up from the NFL box scores; type the opponent's from the CBS page.</span></div></article>`;
  }
  return '';
}
function renderWeek(){
  if(!state.cards.length) return `<div class="cards"><article class="card"><p class="note">Nothing loaded yet. Tap <b>Refresh scores</b>. Sleeper works as is; the ESPN card needs the worker URL and league ID in Settings.</p></article></div>`;

    + `<p class="foot">Projected final = points so far + every starter still to play, at the Vegas-line projection. Pull lines to fill it in; without lines the platform's own projection is shown.</p>`;

// ============================================================ rendering — league start/sit
function oppCell(tg){ if(!tg) return '—'; return (tg.home?'v ':'@ ')+tg.opp; }
function playerCell(e){
  const tags = []; if(e.pos) tags.push(`<span class="tag pos">${esc(e.pos)}</span>`);
  for(const f of e.flags||[]){ const cls = /^(Q|D|OUT|IR|PUP|SUS|NA|COV|DNR)$/.test(f) ? 'inj' : 'warn'; tags.push(`<span class="tag ${cls}">${esc(f)}</span>`); }
  return `<td class="name">${esc(e.name)}${tags.length?' '+tags.join(''):''}</td>`;
}
function statCells(e){
  const s=e.stats||{};
  if(e.pos==='QB') return `<td class="num">${fmt(s.passYds,0)} / ${fmt(s.passTd,2)}</td><td class="num">${fmt(s.rushYds,0)}</td><td class="num">—</td>`;
  if(e.pos==='K') return `<td class="num">—</td><td class="num">—</td><td class="num">${s.kick!=null?fmt(s.kick,1)+' kick':'—'}</td>`;
  if(e.pos==='DST') return `<td class="num">—</td><td class="num">—</td><td class="num">${e.tg&&e.tg.oppImplied!=null?'opp '+fmt(e.tg.oppImplied,1):'—'}</td>`;
  return `<td class="num">—</td><td class="num">${fmt(s.rushYds,0)}</td><td class="num">${s.rec!=null?fmt(s.rec,1)+' / ':''}${fmt(s.recYds,0)}</td>`;
}
const STAT_HEAD = `<th class="num">Pass yds / TD</th><th class="num">Rush yds</th><th class="num">Rec / yds</th><th class="num">TD%</th><th class="num">xTD</th>`;
function statRow(e){ const s=e.stats||{}; return statCells(e)+`<td class="num">${pct(s.pAtd)}</td><td class="num">${fmt(s.xTd,2)}</td>`; }
function rowClass(e){ return e.pts===0 || (e.flags||[]).some(f=>/^(OUT|IR|PUP|SUS|bye)$/.test(f)) ? 'zero' : ''; }

// Free agents: every projected player the league hasn't rostered, scored under this league's rules.
// The start/sit read compares each FA to the weakest eligible starter who hasn't kicked off.
function faGap(v, p, pts){
  let low = null;
  for(const x of v.lineup||[]){ const e = x.player;
    if(!e || e.pts==null) continue;
    if(e.gs && e.gs!=='pre') continue;
    if(!((SLOT_ELIG[x.slot]||[]).includes(p.pos))) continue;
    if(low==null || e.pts<low.pts) low = e; }
  return low ? {gap: pts-low.pts, vs: low.name} : null;
}
function faSection(id, v){
  if(!state.proj) return `<p class="muted">Pull lines to build the free-agent pool.</p>`;
  const mine = new Set(v.entries.map(e => e.key));
  const lr = state.lgRost[id];
  const pool = Object.values(state.proj)
    .filter(p => !mine.has(p.key) && !(lr && (lr.nt.has(p.key+'|'+(p.team||'')) || lr.n.has(p.key))))
    .map(p => ({p, pts: p.leaguePts[id]})).filter(x => x.pts!=null)
    .sort((a,b) => b.pts-a.pts).slice(0,10);
  if(!pool.length) return `<p class="muted">Nobody projectable is left on the wire.</p>`;
  const rows = pool.map(({p,pts}) => {
    const g = faGap(v, p, pts); const add = !!g && g.gap>0.05;
    const tg = p.team ? state.teamGame[p.team] : null;
    return `<tr class="${p.inj&&INACTIVE.test(p.inj)?'zero':''}"><td class="name">${esc(p.name)}${p.inj?` <span class="tag inj">${esc(INJ_SHORT[p.inj]||p.inj)}</span>`:''}${add?' <span class="tag on">ADD?</span>':''}</td><td>${esc(p.pos)}${p.posGuess?'?':''}</td><td>${esc(p.team||'?')}</td><td>${oppCell(tg)}</td><td class="num proj">${fmt(pts)}</td><td class="num"><span class="gap${add?' close':''}">${g?signed(g.gap)+' vs '+esc(g.vs):'—'}</span></td></tr>`;
  }).join('');
  return (lr ? '' : `<p class="muted">League-wide rosters aren't available for this league yet, so some of these may already be owned.</p>`)
    + `<div class="tbl"><table><thead><tr><th>Player</th><th>Pos</th><th>Team</th><th>Opp</th><th class="num">Proj</th><th class="num">vs. weakest starter</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderLeagueTab(id){
  const lg = league(id); if(!lg) return '';
  const card = state.cards.find(c => c.id===id);
  let html = `<div class="cards">${card ? renderCard(card) : `<article class="card"><p class="note">Tap Refresh scores to load this matchup.</p></article>`}</div>`;
  html += `<h2>Start / sit</h2>`;
  if(!state.cache) return html + emptyState();
  const v = state.views[id];
  if(!v || !v.entries.length) return html + `<div class="empty"><p><b>No roster for ${esc(lg.name)} yet.</b></p><p>${lg.platform==='cbs' ? 'Paste it in Settings, one player per line, with * before your current starters.' : 'Refresh scores to pull it from '+(PLATFORM[lg.platform]||'the platform')+'.'}</p>${(v?.notes||[]).map(n=>`<p class="warn">${esc(n)}</p>`).join('')}</div>`;
  let head = `<div class="lede"><div><p><b>Optimal lineup projects ${fmt(v.optPts)} pts</b> under ${esc(lg.name)} scoring.</p>`;
  if(v.cur){
    if(v.cur.net > 0.05) head += `<p>Your current lineup projects ${fmt(v.cur.pts)}. ${v.cur.ins.length} change${v.cur.ins.length===1?'':'s'} add <span class="up">${signed(v.cur.net)}</span>.</p><ul class="swaps">`
      + v.cur.pairs.map(x => `<li>Start <b>${esc(x.in.name)}</b> (${fmt(x.in.pts)})${x.out?` over <b>${esc(x.out.name)}</b> (${fmt(x.out.pts)})`:''}</li>`).join('') + '</ul>';
    else head += `<p class="up">Your current lineup already matches the optimal one.</p>`;
  } else if(lg.platform==='cbs') head += `<p class="muted">Put * before your current starters in Settings to see swap suggestions.</p>`;
  head += `</div><div><button class="small" data-copy="${esc(id)}">Copy lineup as text</button></div></div>`;
  if(v.notes.length) head += v.notes.map(n => `<p class="warn">${esc(n)}</p>`).join('');
  const rows = v.lineup.map(x => {
    if(!x.player) return `<tr><td class="slot">${x.label}</td><td class="name muted">No eligible player</td><td></td><td></td><td class="num">—</td><td class="num proj">—</td>${STAT_HEAD.replace(/<th[^>]*>.*?<\/th>/g,'<td class="num">—</td>')}</tr>`;
    const e = x.player;
    return `<tr class="${rowClass(e)}"><td class="slot">${x.label}</td>${playerCell(e)}<td>${esc(e.team||'')}</td><td>${oppCell(e.tg)}</td><td class="num proj">${fmt(e.pts)}</td>${statRow(e)}</tr>`;
  }).join('');
  html += head + `<div class="tbl"><table><thead><tr><th>Slot</th><th>Player</th><th>Team</th><th>Opp</th><th class="num">Proj</th>${STAT_HEAD}</tr></thead><tbody>${rows}</tbody></table></div>`;
  html += `<h2>Bench</h2>`;
  if(!v.bench.length) html += `<p class="muted">Nothing on the bench.</p>`;
  else html += `<div class="tbl"><table><thead><tr><th>Player</th><th>Team</th><th>Opp</th><th class="num">Proj</th><th class="num">vs. lowest starter</th>${STAT_HEAD}</tr></thead><tbody>` +
    v.bench.map(e => `<tr class="${rowClass(e)}${e.gap!=null && e.gap>-1.5?' close':''}">${playerCell(e)}<td>${esc(e.team||'')}</td><td>${oppCell(e.tg)}</td><td class="num proj">${fmt(e.pts)}</td><td class="num"><span class="gap${e.gap!=null&&e.gap>-1.5?' close':''}">${e.gap!=null?signed(e.gap)+' vs '+esc(e.gapVs):'—'}</span></td>${statRow(e)}</tr>`).join('') + `</tbody></table></div>`;
  if(v.taxi.length) html += `<h3>Taxi</h3><p class="muted">${v.taxi.map(e=>esc(e.name)).join(', ')}</p>`;
  if(v.ir.length) html += `<h3>IR</h3><p class="muted">${v.ir.map(e=>esc(e.name)).join(', ')}</p>`;
  html += `<h2>Free agents</h2>` + faSection(id, v);
  html += `<p class="foot">${esc(lg.note||'')} Projections are market consensus across the books returned: yardage and reception lines shifted by their Over/Under prices, passing-TD and anytime-TD prices converted to expected TDs (Poisson), and each team's TD probabilities scaled down to its implied total to strip the vig. Bench rows within 1.5 pts of a starter are highlighted. DST and any kicker without a kicking-points line are heuristics from implied totals. Once a game starts its players are locked: <b>final</b> rows keep their actual score, <b>live</b> rows show points so far, and swap advice only moves players who haven't kicked off. Leagues without a platform score feed (CBS) settle from the NFL box score — TDs, kicker points, and def/ST return TDs.</p>`;
  return html;
}

function renderBoard(){
  if(!state.proj) return emptyState();
  const b = state.board, lgs = state.config.leagues;
  const games = Object.values(state.cache.games).sort((x,y) => Date.parse(x.commence)-Date.parse(y.commence));
  let html = `<div class="games">` + games.map(g => { const d=new Date(g.commence); return `<div class="game"><b>${g.away} @ ${g.home}</b> ${d.toLocaleString('en-US',{weekday:'short',hour:'numeric'})}${g.stale?' <span class="tag">earlier pull</span>':''}<br>${g.spreadHome!=null?(g.home+' '+(g.spreadHome>0?'+':'')+g.spreadHome):'—'} , o/u ${fmt(g.total,1)}<br>${g.away} ${fmt(g.implied[g.away],1)} , ${g.home} ${fmt(g.implied[g.home],1)}</div>`; }).join('') + `</div>`;
  html += `<div class="filters"><label>Position <select id="fPos">${['ALL','QB','RB','WR','TE','K'].map(p=>`<option${b.pos===p?' selected':''}>${p}</option>`).join('')}</select></label><label><input type="checkbox" id="fMine"${b.mine?' checked':''}> My players only</label><label>Search <input type="text" id="fQ" value="${esc(b.q)}" style="width:180px"></label></div>`;
  let rows = Object.values(state.proj);
  if(b.pos!=='ALL') rows = rows.filter(p => p.pos===b.pos);
  if(b.mine) rows = rows.filter(p => state.rostered[p.key]);
  if(b.q){ const q = normName(b.q); rows = rows.filter(p => p.key.includes(q) || (p.team||'').toLowerCase()===q); }
  const val = (p,col) => { if(col.startsWith('pts:')) return p.leaguePts[col.slice(4)]; const s=p.stats; return {name:p.key, pos:p.pos, team:p.team||'', passYds:s.passYds, passTd:s.passTd, ints:s.ints, rushYds:s.rushYds, rec:s.rec, recYds:s.recYds, pAtd:s.pAtd, xTd:s.xTd}[col]; };
  rows.sort((x,y) => { const a=val(x,b.sort), c=val(y,b.sort); if(a==null&&c==null) return 0; if(a==null) return 1; if(c==null) return -1; return (a<c?-1:a>c?1:0)*b.dir; });
  const cols = [['name','Player',''],['pos','Pos',''],['team','Team',''],['passYds','Pass yds','num'],['passTd','Pass TD','num'],['ints','INT','num'],['rushYds','Rush yds','num'],['rec','Rec','num'],['recYds','Rec yds','num'],['pAtd','TD%','num'],['xTd','xTD','num'], ...lgs.map(l => ['pts:'+l.id, (l.short||l.name)+' pts','num'])];
  const th = cols.map(([k,l,c]) => `<th class="sortable ${c}${b.sort===k?' sorted':''}" data-sort="${k}">${esc(l)}${b.sort===k?(b.dir<0?' ▾':' ▴'):''}</th>`).join('') + '<th>Rostered</th>';
  const tr = rows.slice(0,400).map(p => { const s=p.stats, tg=p.team?state.teamGame[p.team]:null; const r=state.rostered[p.key];
    return `<tr class="${p.inj&&INACTIVE.test(p.inj)?'zero':''}"><td class="name">${esc(p.name)}${p.inj?` <span class="tag inj">${esc(INJ_SHORT[p.inj]||p.inj)}</span>`:''}</td><td>${esc(p.pos)}${p.posGuess?'?':''}</td><td>${esc(p.team||'?')}${tg?' '+oppCell(tg):''}</td><td class="num">${fmt(s.passYds,0)}</td><td class="num">${fmt(s.passTd,2)}</td><td class="num">${fmt(s.ints,2)}</td><td class="num">${fmt(s.rushYds,0)}</td><td class="num">${fmt(s.rec,1)}</td><td class="num">${fmt(s.recYds,0)}</td><td class="num">${pct(s.pAtd)}</td><td class="num">${fmt(s.xTd,2)}</td>${lgs.map(l=>`<td class="num proj">${fmt(p.leaguePts[l.id])}</td>`).join('')}<td>${r?r.map(x=>`<span class="tag on">${esc(x)}</span>`).join(' '):''}</td></tr>`; }).join('');
  html += `<div class="tbl"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div><p class="foot">${rows.length} players with props this week${rows.length>400?' (showing the top 400 — use the filters)':''}. Every player the books list, scored under each league's rules: use it for waivers and streamers, not just your roster.</p>`;
  return html;
}

      <div class="field"><label>Roster (fallback when the CBS link is off)</label><textarea data-lg="${i}" data-k="roster" placeholder="One player per line. Put * before current starters. DST as 'Titans DST'. Add (TEAM) after a name if two players share it.">${esc((l.roster||[]).join('\n'))}</textarea><p class="help">One per line. * marks a current starter. DST as "Titans DST". Add (TEAM) after a name if two players share it.</p></div>
      <div class="field"><label>My team name</label><input type="text" data-lg="${i}" data-k="myTeam" value="${esc(l.myTeam||'')}"></div>
      <div class="field"><label>League URL</label><input type="url" data-lg="${i}" data-k="url" value="${esc(l.url||'')}" placeholder="https://….football.cbssports.com/…"></div>
      <div class="field"><label>Schedule (week: opponent)</label><textarea data-lg="${i}" data-k="schedule">${esc(Object.entries(l.schedule||{}).sort((a,b)=>a[0]-b[0]).map(([w,o])=>`${w}: ${o}`).join('\n'))}</textarea></div>`;
    return `<div class="panel"><h3>${esc(l.name)} <span class="tag">${esc(PLATFORM[l.platform]||l.platform)}</span></h3>${inner}
      <p class="help">Scoring: ${Object.entries(l.scoring).map(([k,v])=>k+' '+v).join(', ')}. Lineup: ${Object.entries(l.lineup).filter(([k,v])=>v).map(([k,v])=>v+' '+k).join(', ')}. Edit these in the JSON below.</p></div>`;
  }).join('');
  return `<div class="grid">
    <div class="panel"><h3>Cloudflare Worker</h3>
      <div class="field"><label>Worker URL</label><input type="url" id="sWorker" value="${esc(c.worker)}" placeholder="https://startline-proxy.….workers.dev"><p class="help">One worker for both feeds: <code>/sports/…</code> adds the Odds API key, <code>/espn/…</code> adds the ESPN cookies. Keys live in the worker's secrets, never on this page.</p></div>
      <div class="field"><label>Bookmakers (blank = every US book returned)</label><input type="text" id="sBooks" value="${esc(c.odds.books)}" placeholder="draftkings,fanduel,betmgm,espnbet"><p class="help">Odds API bookmaker keys, comma separated. Consensus across more books is steadier.</p></div>
      <div class="field"><label>Prop markets pulled per game</label><input type="text" id="sMarkets" value="${esc(c.odds.markets)}"><p class="help">Each market costs 1 credit per game. Remove one here if the API stops offering it.</p></div>
    </div>
    <div class="panel"><h3>Sleeper &amp; names</h3>
      <div class="field"><label>Sleeper username</label><input type="text" id="sUser" value="${esc(c.sleeper.username)}"></div>
      <div class="field"><label>Name aliases (book name → Sleeper name), JSON</label><textarea id="sAliases" style="min-height:70px">${esc(JSON.stringify(c.aliases))}</textarea><p class="help">For a player the books list under a different name than Sleeper does.</p></div>
      <div class="field"><label>Refresh scores every (seconds, while a starter is playing)</label><input type="number" id="sRefresh" value="${esc(c.refreshSeconds)}" min="20"></div>
    </div>
    <div class="panel"><h3>Phone sync</h3>
      <div class="field"><label>PIN</label><input type="password" id="sPin" autocomplete="off" value="${esc(localStorage.getItem(LS.pin)||'')}" placeholder="4+ characters"><p class="help">Settings are encrypted right here in the browser with this PIN; the worker only ever stores the sealed blob. On the phone: same worker URL, same PIN, then “Load from worker”.</p></div>
      <div class="actions"><button id="sSyncUp">Save to worker</button><button id="sSyncDown">Load from worker</button></div>
      <p class="help" id="sSyncMsg">${esc(syncMsg)}</p>
    </div>
    ${leagueBlocks}
    <div class="panel" style="grid-column:1/-1"><h3>Everything, as JSON</h3><textarea class="json" id="sJSON">${esc(JSON.stringify(c, null, 2))}</textarea><p class="help">Scoring, lineup slots, and new leagues live here. Add a league by copying one of the objects. Applying this replaces the fields above.</p>
      <div class="actions"><button class="primary" id="sSave">Save settings</button><button id="sApplyJSON">Apply JSON</button><button id="sExport">Export config</button><button id="sImport">Import config</button><button id="sClearCache">Clear cached lines</button><button id="sReset">Reset to defaults</button></div>
      <p class="help" id="sMsg"></p></div>
  </div>`;
}
function saveSettingsForm(){
  const c = state.config;
  c.worker = $('#sWorker').value.trim();
  c.odds.books = $('#sBooks').value.trim(); c.odds.markets = $('#sMarkets').value.trim();
  c.sleeper.username = $('#sUser').value.trim();
  c.refreshSeconds = Math.max(20, Number($('#sRefresh').value)||60);
  try{ c.aliases = JSON.parse($('#sAliases').value||'{}'); }catch(e){ $('#sMsg').textContent='Aliases must be valid JSON'; return; }
  document.querySelectorAll('[data-lg]').forEach(el => {
    const l = c.leagues[Number(el.dataset.lg)], k = el.dataset.k; if(!l) return;
    if(k==='roster') l.roster = el.value.split('\n').map(s=>s.trim()).filter(Boolean);
    else if(k==='schedule'){ const s={}; for(const line of el.value.split('\n')){ const m = line.match(/^\s*(\d+)\s*[:\-–]\s*(.+?)\s*$/); if(m) s[m[1]]=m[2]; } l.schedule = s; }
    else if(k==='season') l.season = Number(el.value)||l.season;
    else l[k] = el.value.trim();
  });
  saveJSON(LS.config, c); toast('Settings saved'); refreshScores();
}

// ---- phone sync: the PIN never leaves this page. It derives (PBKDF2) an AES-GCM key that seals
// the settings JSON in the browser; the worker stores only that ciphertext, filed under a separate
// SHA-256 id, so neither the worker nor its KV ever sees the PIN or the plaintext.
let syncMsg = '';
function setSync(t){ syncMsg = t; const el = $('#sSyncMsg'); if(el) el.textContent = t; }
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pinKeys(pin){
  const te = new TextEncoder();
  const idBuf = await crypto.subtle.digest('SHA-256', te.encode('startline-cfg-v1|id|'+pin));
  const id = [...new Uint8Array(idBuf)].map(b => b.toString(16).padStart(2,'0')).join('');
  const mat = await crypto.subtle.importKey('raw', te.encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:te.encode('startline-cfg-v1'), iterations:150000, hash:'SHA-256'},
                                            mat, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  return {id, key};
}
function syncPre(){
  const pin = ($('#sPin').value||'').trim();
  if(pin.length<4){ setSync('Use a PIN of at least 4 characters.'); return null; }
  if(!workerBase()){ setSync('Add the worker URL first — the blob lives on your worker.'); return null; }
  return pin;
}
async function syncUp(){
  const pin = syncPre(); if(!pin) return;
  setSync('Encrypting and saving…');
  try{
    const {id, key} = await pinKeys(pin);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(state.config)));
    const r = await fetch(`${workerBase()}/cfg/${id}`, {method:'PUT', body: b64(iv)+'.'+b64(ct)});
    if(!r.ok) throw new Error(await r.text());
    try{ localStorage.setItem(LS.pin, pin); }catch(e){}
    setSync('Saved. On the phone: same worker URL, same PIN, then “Load from worker”.');
  }catch(e){ setSync('Save failed: '+e.message); }
}
async function syncDown(){
  const pin = syncPre(); if(!pin) return;
  setSync('Loading…');
  try{
    const {id, key} = await pinKeys(pin);
    const r = await fetch(`${workerBase()}/cfg/${id}`);
    if(!r.ok) throw new Error(await r.text());
    const [ivs, cts] = (await r.text()).split('.');
    const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(ivs)}, key, unb64(cts)).catch(() => { throw new Error('could not decrypt — wrong PIN?'); });
    const cfg = JSON.parse(new TextDecoder().decode(buf));
    if(!Array.isArray(cfg.leagues)) throw new Error('the saved blob is not a settings object');
    state.config = {...cfg, worker: cfg.worker || state.config.worker};
    saveJSON(LS.config, state.config);
    try{ localStorage.setItem(LS.pin, pin); }catch(e){}
    setSync('Settings loaded.'); toast('Settings loaded from the worker');
    render(); refreshScores();
  }catch(e){ setSync('Load failed: '+e.message); }
}

// ============================================================ event wiring
function bind(){
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyLineup(b.dataset.copy));
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    const lg = league(b.dataset.lgid); if(!lg) return;
    lg.myTeamId = Number(b.dataset.pick); saveJSON(LS.config, state.config); refreshScores();
  });
  document.querySelectorAll('input[data-cbs]').forEach(i => i.oninput = () => {
    const w = state.week || state.autoWeek || 1;
    state.cbs[w] = {...(state.cbs[w]||{}), [i.dataset.cbs]: i.value===''?null:Number(i.value)};
    saveJSON(LS.cbs, state.cbs);
    const card = state.cards.find(c => c.kind==='cbs'); if(card) card.scores = state.cbs[w];
    const el = $('#cbsRec'); if(el) el.textContent = cbsRecord();
  });
  if(state.tab==='board' && state.proj){
    $('#fPos').onchange = e => { state.board.pos=e.target.value; render(); };
    $('#fMine').onchange = e => { state.board.mine=e.target.checked; render(); };
    $('#fQ').oninput = e => { state.board.q=e.target.value; render(); $('#fQ').focus(); $('#fQ').setSelectionRange(1e4,1e4); };
    document.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => { const k=th.dataset.sort; if(state.board.sort===k) state.board.dir*=-1; else { state.board.sort=k; state.board.dir = k==='name'||k==='pos'||k==='team' ? 1 : -1; } render(); });
  }
  if(state.tab==='settings'){
    $('#sSave').onclick = saveSettingsForm;
    $('#sApplyJSON').onclick = () => { try{ const c = JSON.parse($('#sJSON').value); if(!Array.isArray(c.leagues)) throw new Error('leagues must be an array'); state.config = c; saveJSON(LS.config, c); toast('Settings saved from JSON'); refreshScores(); }catch(e){ $('#sMsg').textContent = 'JSON problem: '+e.message; } };
    $('#sExport').onclick = () => { const a=document.createElement('a'); a.href='data:application/json,'+encodeURIComponent(JSON.stringify(state.config,null,2)); a.download='startline-config.json'; a.click(); };
    $('#sImport').onclick = () => { const i=document.createElement('input'); i.type='file'; i.accept='.json'; i.onchange = async () => { try{ const c=JSON.parse(await i.files[0].text()); state.config=c; saveJSON(LS.config,c); toast('Config imported'); refreshScores(); }catch(e){ toast('Import failed: '+e.message); } }; i.click(); };
    $('#sClearCache').onclick = () => { localStorage.removeItem(LS.cache); state.cache=null; state.credits=null; recompute(); applyProjectedFinals(); render(); };
    $('#sReset').onclick = () => { if(confirm('Reset every setting and roster to the defaults?')){ localStorage.removeItem(LS.config); state.config=loadConfig(); recompute(); render(); } };
    $('#sSyncUp').onclick = syncUp; $('#sSyncDown').onclick = syncDown;
    document.querySelectorAll('[data-clearteam]').forEach(b => b.onclick = () => { const lg = league(b.dataset.clearteam); if(lg){ lg.myTeamId=null; delete state.live[lg.id]; saveJSON(LS.config, state.config); refreshScores(); } });
  }
}
function copyLineup(id){
  const v = state.views[id]; if(!v) return;
  const wk = state.week || state.autoWeek;
  const lines = [`${v.league.name} — ${wk?'Week '+wk:'this week'} (optimal ${fmt(v.optPts)} pts)`];
  for(const x of v.lineup) lines.push(`${x.label.padEnd(6)} ${x.player ? `${x.player.name} (${x.player.team||'?'}${x.player.tg?' '+oppCell(x.player.tg):''}) ${fmt(x.player.pts)}` : '—'}`);
  lines.push('Bench: ' + v.bench.map(e => `${e.name} ${fmt(e.pts)}`).join(', '));
  navigator.clipboard.writeText(lines.join('\n')).then(() => toast('Lineup copied'), () => toast('Clipboard blocked by the browser'));
}

// ============================================================ boot
(function init(){
  state.config = loadConfig();
  state.cache = loadJSON(LS.cache); state.credits = state.cache?.credits || null;
  state.players = loadJSON(LS.players); state.live = loadJSON(LS.live) || {};
  state.nfl = loadJSON(LS.nfl) || {}; state.cbs = loadJSON(LS.cbs) || {};
  state.box = loadJSON(LS.box) || {};
  state.tab = localStorage.getItem(LS.tab);
  state.board.sort = 'pts:' + (state.config.leagues[0]?.id || '');
  const snap = loadJSON(LS.snap);
  if(snap){ state.cards = snap.cards||[]; state.at = snap.at; state.autoWeek = snap.autoWeek; state.season = snap.season; state.sbIdx = snap.sbIdx||{}; }
  $('#btnPull').onclick = pullLines;
  $('#btnScores').onclick = () => refreshScores();
  $('#prev').onclick = () => { state.week = Math.max(1, (state.week||state.autoWeek||1)-1); refreshScores(); };
  $('#next').onclick = () => { state.week = Math.min(18, (state.week||state.autoWeek||1)+1); if(state.week===state.autoWeek) state.week=null; refreshScores(); };
  $('#wk').onclick = () => { state.week = null; refreshScores(); };
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && state.at && Date.now()-state.at > 45e3) refreshScores(); });
  recompute(); applyProjectedFinals(); render();
  refreshScores();
})();
</script>
</body>
</html>
